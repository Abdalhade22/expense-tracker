<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
    </div>
  </nav>

  <main class="container py-4">
    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

    <div id="loading" class="text-center py-3 d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mb-0 mt-2">Loading...</p>
    </div>

    <section class="summary-grid mb-4">
      <div class="card summary-card">
        <div class="card-body">
          <p class="text-muted mb-1">Total Amount</p>
          <h3 id="totalAmount" class="mb-0">$0.00</h3>
        </div>
      </div>
      <div class="card summary-card">
        <div class="card-body">
          <p class="text-muted mb-1">Number of Expenses</p>
          <h3 id="expenseCount" class="mb-0">0</h3>
        </div>
      </div>
      <div class="card summary-card">
        <div class="card-body">
          <p class="text-muted mb-1">Highest Expense</p>
          <h3 id="highestExpense" class="mb-0">$0.00</h3>
        </div>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h4 mb-3">Add Expense</h2>
        <form id="expenseForm">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" class="form-control" maxlength="100" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" id="amount" class="form-control" min="0.01" step="0.01" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select" required>
                <option value="">Choose a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label for="date" class="form-label">Date</label>
              <input type="date" id="date" class="form-control" required>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Add Expense</button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <section class="card">
      <div class="card-body">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
          <h2 class="h4 mb-0">Expenses</h2>
          <div>
            <label for="categoryFilter" class="form-label me-2 mb-0">Filter:</label>
            <select id="categoryFilter" class="form-select d-inline-block filter-select">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expensesTable"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="editModalLabel">Edit Expense</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="editErrorMessage" class="alert alert-danger d-none" role="alert"></div>
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" id="editTitle" class="form-control" maxlength="100" required>
            </div>
            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount</label>
              <input type="number" id="editAmount" class="form-control" min="0.01" step="0.01" required>
            </div>
            <div class="mb-3">
              <label for="editCategory" class="form-label">Category</label>
              <select id="editCategory" class="form-select" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div>
              <label for="editDate" class="form-label">Date</label>
              <input type="date" id="editDate" class="form-control" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
